[mypy]
python_version = 3.12
strict = True
explicit_package_bases = True
# The gateway imports the motor's attestation modules (execution_motor.canonical/verifiers/
# keys/errors); mypy follows them from the sibling package directory.
mypy_path = $MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/../execution-motor
namespace_packages = True
warn_unreachable = True
