[package]
name = "aegis"
version = "0.1.0"
edition = "2021"
description = "Zone B: Deterministic pre-trade controls, HSM signing, and heartbeat monitor"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
# PKCS#11 interface for SoftHSM2 / CloudHSM
cryptoki = "0.7"
# Redis for execution state
redis = { version = "0.27", features = ["tokio-comp"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Config
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
# Time
chrono = { version = "0.4", features = ["serde"] }
# UUID
uuid = { version = "1", features = ["v4"] }
# SHA-256 for manifest chaining
sha2 = "0.10"
# Environment
tokio-signal = "0.2"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "aegis"
path = "src/main.rs"
