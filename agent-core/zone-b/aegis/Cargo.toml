[package]
name = "aegis"
version = "0.1.0"
edition = "2021"
description = "Zone B: Deterministic pre-trade controls, kill switches, and attestation signing (Aegis risk gate)"
publish = false

[lib]
name = "aegis"
path = "src/lib.rs"

[[bin]]
name = "aegis"
path = "src/main.rs"

[features]
default = []
# PKCS#11 signer adapter (SoftHSM2 in dev, HSM in production). ADR-001.
pkcs11 = ["dep:cryptoki", "dep:p256"]
# In-memory test rig shared with integration tests (enabled via the dev-dependency below).
testkit = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
x509-parser = "0.16"
cryptoki = { version = "0.7", optional = true }
p256 = { version = "0.13", optional = true, features = ["ecdsa"] }

[dev-dependencies]
aegis = { path = ".", features = ["testkit"] }
proptest = "1"
rcgen = "0.13"
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
