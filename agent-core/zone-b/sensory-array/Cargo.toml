[package]
name = "sensory-array"
version = "0.1.0"
edition = "2021"
description = "Zone B: Real-time WebSocket ingestor for US equities Level 2 order book data"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UUID for snapshot IDs
uuid = { version = "1", features = ["v4"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# gRPC for regime label subscription from Zone A
tonic = "0.12"
prost = "0.13"
# Redis pub/sub for snapshot publishing + regime label subscription
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
# Metrics / structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Config
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
# Statistics (Z-Score + MAD normalization)
statrs = "0.17"

[dev-dependencies]
tokio-test = "0.4"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "sensory-array"
path = "src/main.rs"
