# Three-zone trading infrastructure (local / staging shape, NOT a production deployment).
#
#   Zone A  thinking   : cognitive-core, regime-detector, vector-db (token proxy) + vector-db-store (Chroma).
#                        No general internet.
#   Zone B  execution  : sensory-array, aegis (execution-motor is not runnable yet, see below).
#   Zone C  compliance : postgres-audit (hash-chained audit DB), hitl-interface.
#
# Usage (paths are relative to this directory):
#   cp .env.example .env            # then fill EVERY empty value; nothing here has a default secret
#   docker compose config           # validate (fails loudly on any missing ${VAR:?} secret)
#   docker compose up -d            # base file only: secure defaults, no host ports except HITL on loopback
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d   # local dev (insecure Aegis, host ports)
#
# Design rules enforced by this file:
#   * Secrets come only from the environment via ${VAR:?message}; there are no default secrets.
#   * Zone networks are `internal: true`. Only sensory-array (Polygon) and, when enabled, execution-motor
#     (broker) get a non-internal egress network; cognitive-core's LLM egress network is PROPOSED in ADR-003.
#   * Host ports: only hitl-interface (bound to 127.0.0.1). Everything else is published by
#     docker-compose.dev.yml for local development only.
#   * Images are pinned (no :latest). Health checks that need no curl/wget use bash /dev/tcp because the
#     chroma and questdb images ship neither curl nor wget (verified on the pinned tags).
#   * Resource limits (owner decision, ALI-20): every service has mem_limit, cpus and pids_limit from
#     required <SERVICE>_MEM_LIMIT / <SERVICE>_CPUS / <SERVICE>_PIDS_LIMIT variables with no defaults.
#     .env.example carries PROPOSED, unprofiled starting values. pids_limit counts threads too.
#   * Data stores authenticate every client (ALI-20): Redis per-service ACL users, QuestDB HTTP basic
#     auth + PG-wire credentials + ILP ECDSA key, Chroma behind a bearer-token proxy, Postgres roles.
#   * Third-party images run with cap_drop ALL, no-new-privileges and, where verified to start,
#     read_only + tmpfs and a fixed non-root uid (so the entrypoints never need chown/setuid caps).
#
# Requires Docker Compose >= 2.24 (the dev override uses the !reset tag).

name: afe

networks:
  zone-a-internal:
    internal: true # Zone A: no route out of the host
  zone-a-chroma:
    internal: true # Chroma (vector-db-store) <-> its token proxy (vector-db) only
  zone-ab-grpc:
    internal: true # Zone A <-> B (gRPC to Aegis, Redis pub/sub, QuestDB)
  zone-bc-audit:
    internal: true # Zone B/C audit path and audit database
  zone-b-egress: {} # Zone B market-data / broker egress (sensory-array). Restrict at the host firewall.
  zone-a-llm-egress: {} # PROPOSED (ADR-003 option 1): Bedrock egress for cognitive-core. Restrict at the host firewall.
  zone-c-external: {} # Zone C: operator access (HITL)

services:
  # -------------------------------------------------------------
  # ZONE A - THINKING
  # -------------------------------------------------------------
  cognitive-core:
    # Build context is agent-core/ so the image can include shared/proto and zone-a/vector-db.
    build:
      context: ..
      dockerfile: zone-a/cognitive-core/Dockerfile
    container_name: afe-cognitive-core
    mem_limit: ${COGNITIVE_CORE_MEM_LIMIT:?set COGNITIVE_CORE_MEM_LIMIT (see .env.example)}
    cpus: ${COGNITIVE_CORE_CPUS:?set COGNITIVE_CORE_CPUS (see .env.example)}
    pids_limit: ${COGNITIVE_CORE_PIDS_LIMIT:?set COGNITIVE_CORE_PIDS_LIMIT (see .env.example)}
    environment:
      PYTHONUNBUFFERED: "1"
      # LLM access is AWS Bedrock (ADR-002, IAM role auth). Region has no safe default.
      COGNITIVE_BEDROCK_REGION: ${COGNITIVE_BEDROCK_REGION:?set the AWS region that hosts the Bedrock models}
      COGNITIVE_SINK: grpc
      ZONE_B_GRPC_HOST: aegis
      ZONE_B_GRPC_PORT: "50051"
      REDIS_URL: redis://cognitive-core:${REDIS_COGNITIVE_PASSWORD:?}@redis:6379
      SNAPSHOT_CHANNEL: sensory:snapshots
      COGNITIVE_MEMORY_ENABLED: "true"
      CHROMA_HOST: vector-db
      CHROMA_PORT: "8000"
      CHROMA_AUTH_TOKEN: ${CHROMA_AUTH_TOKEN:?set CHROMA_AUTH_TOKEN (hex, >= 32 chars)}
      # 0 => every debate abstains. TODO(owner): replace with the position sizer before live use.
      COGNITIVE_ORDER_QUANTITY: ${COGNITIVE_ORDER_QUANTITY:-0}
      # Position sizer (ALI-160). vol_scaled needs all three values below; no defaults (startup fails).
      COGNITIVE_SIZER: ${COGNITIVE_SIZER:-fixed}
      COGNITIVE_SIZER_EQUITY_USD: ${COGNITIVE_SIZER_EQUITY_USD:-}
      COGNITIVE_SIZER_RISK_PER_TRADE: ${COGNITIVE_SIZER_RISK_PER_TRADE:-}
      COGNITIVE_SIZER_MAX_ORDER_NOTIONAL_USD: ${COGNITIVE_SIZER_MAX_ORDER_NOTIONAL_USD:-}
      COGNITIVE_STRATEGY_ID: ${COGNITIVE_STRATEGY_ID:-AFE-STRATEGY-001}
    depends_on:
      vector-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zone-a-internal
      - zone-ab-grpc
      - zone-a-llm-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  regime-detector:
    build:
      context: ../zone-a/regime-detector
      dockerfile: Dockerfile
    container_name: afe-regime-detector
    mem_limit: ${REGIME_DETECTOR_MEM_LIMIT:?set REGIME_DETECTOR_MEM_LIMIT (see .env.example)}
    cpus: ${REGIME_DETECTOR_CPUS:?set REGIME_DETECTOR_CPUS (see .env.example)}
    pids_limit: ${REGIME_DETECTOR_PIDS_LIMIT:?set REGIME_DETECTOR_PIDS_LIMIT (see .env.example)}
    environment:
      QUESTDB_HOST: questdb
      QUESTDB_PORT: "9000"
      QUESTDB_HTTP_USER: ${QUESTDB_HTTP_USER:?set QUESTDB_HTTP_USER}
      QUESTDB_HTTP_PASSWORD: ${QUESTDB_HTTP_PASSWORD:?set QUESTDB_HTTP_PASSWORD (>= 16 chars)}
      REDIS_URL: redis://regime-detector:${REDIS_REGIME_PASSWORD:?}@redis:6379
      MODEL_DIR: /app/models
      # Without a key (>= 32 chars) models are trained in memory only and never persisted.
      MODEL_HMAC_KEY: ${MODEL_HMAC_KEY:?set MODEL_HMAC_KEY (>= 32 chars, e.g. openssl rand -base64 48)}
    volumes:
      - regime-models:/app/models
    depends_on:
      questdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zone-a-internal
      - zone-ab-grpc # Redis (regime:labels) lives on the A<->B network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # HEALTHCHECK is defined in the image (heartbeat file).

  # vector-db is a bearer-token gate (nginx) in front of Chroma (ALI-20). The pinned Chroma 1.5.9 (Rust
  # server) ignores CHROMA_SERVER_AUTHN_* (verified 2026-09-29: collections listed with no token), so
  # Chroma itself (vector-db-store) sits alone on zone-a-chroma and only this proxy reaches it. Clients
  # keep CHROMA_HOST=vector-db and send "Authorization: Bearer ${CHROMA_AUTH_TOKEN}" (afe_vector_memory).
  vector-db:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: afe-vector-db
    mem_limit: ${VECTOR_DB_MEM_LIMIT:?set VECTOR_DB_MEM_LIMIT (see .env.example)}
    cpus: ${VECTOR_DB_CPUS:?set VECTOR_DB_CPUS (see .env.example)}
    pids_limit: ${VECTOR_DB_PIDS_LIMIT:?set VECTOR_DB_PIDS_LIMIT (see .env.example)}
    user: "101:101" # nginx; no root master, so no CAP_SETUID/SETGID needed (the `user` directive is ignored)
    environment:
      CHROMA_AUTH_TOKEN: ${CHROMA_AUTH_TOKEN:?set CHROMA_AUTH_TOKEN (hex, >= 32 chars; openssl rand -hex 32)}
      NGINX_ENVSUBST_FILTER: CHROMA_AUTH_TOKEN # render only this variable into the template
    volumes:
      - ./vector-db-proxy:/etc/nginx/templates:ro
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755 # rendered template
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /run:uid=101,gid=101,mode=0755 # nginx.pid
      - /tmp:uid=101,gid=101,mode=0700
    read_only: true # verified 2026-09-29 with cap_drop ALL and the tmpfs mounts above
    depends_on:
      vector-db-store:
        condition: service_healthy
    networks:
      - zone-a-internal
      - zone-a-chroma
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      # Goes through the token check and on to Chroma's v2 heartbeat (busybox wget is in the image).
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null --header "Authorization: Bearer $$CHROMA_AUTH_TOKEN" http://127.0.0.1:8000/api/v2/heartbeat'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  vector-db-store:
    # Keep the tag on the same major.minor as the chromadb client pin in zone-a/vector-db/requirements.txt.
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: afe-vector-db-store
    mem_limit: ${VECTOR_DB_STORE_MEM_LIMIT:?set VECTOR_DB_STORE_MEM_LIMIT (see .env.example)}
    cpus: ${VECTOR_DB_STORE_CPUS:?set VECTOR_DB_STORE_CPUS (see .env.example)}
    pids_limit: ${VECTOR_DB_STORE_PIDS_LIMIT:?set VECTOR_DB_STORE_PIDS_LIMIT (see .env.example)}
    volumes:
      - chroma-data:/data # persist_path in the image config is /data
    tmpfs:
      - /tmp
    # Verified 2026-09-29: starts and serves reads/writes with read_only + cap_drop ALL. It still runs as
    # root inside the container (the image has no other user; chroma-data is root-owned).
    # TODO(owner): run as a non-root uid (needs a chown of the existing chroma-data volume).
    read_only: true
    networks:
      - zone-a-chroma # only the vector-db proxy is on this network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      # /api/v1 is gone in 1.x (410); v2 heartbeat verified on 1.5.9. No curl/wget in the image.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && read -r line <&3 && [[ $$line == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # ZONE B - EXECUTION
  # -------------------------------------------------------------
  sensory-array:
    build:
      context: ../zone-b/sensory-array
      dockerfile: Dockerfile
      args:
        CARGO_FEATURES: ilp-secure # ILP ECDSA auth to QuestDB (src/ilp_secure.rs)
    container_name: afe-sensory-array
    mem_limit: ${SENSORY_ARRAY_MEM_LIMIT:?set SENSORY_ARRAY_MEM_LIMIT (see .env.example)}
    cpus: ${SENSORY_ARRAY_CPUS:?set SENSORY_ARRAY_CPUS (see .env.example)}
    pids_limit: ${SENSORY_ARRAY_PIDS_LIMIT:?set SENSORY_ARRAY_PIDS_LIMIT (see .env.example)}
    environment:
      POLYGON_API_KEY: ${POLYGON_API_KEY:?set POLYGON_API_KEY}
      QUESTDB_ILP_HOST: questdb
      QUESTDB_ILP_PORT: "9009"
      # ALI-20: ECDSA challenge/response on the ILP socket; QuestDB drops unauthenticated writers
      # (verified against questdb 8.0.3, tests/live_sinks.rs). No TLS on this hop (internal network).
      QUESTDB_ILP_AUTH_KEY_ID: ${QUESTDB_ILP_AUTH_KEY_ID:?set QUESTDB_ILP_AUTH_KEY_ID (the kid in auth.conf)}
      QUESTDB_ILP_AUTH_TOKEN: ${QUESTDB_ILP_AUTH_TOKEN:?set QUESTDB_ILP_AUTH_TOKEN (base64url P-256 private scalar)}
      REDIS_URL: redis://sensory-array:${REDIS_SENSORY_PASSWORD:?}@redis:6379
      FRESHNESS_L2_MS: "1"
      FRESHNESS_PRINT_MS: "5"
    depends_on:
      questdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zone-ab-grpc # QuestDB ILP, Redis (snapshots out, regime labels in)
      - zone-b-egress # Polygon WebSocket (wss://socket.polygon.io)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # HEALTHCHECK is defined in the image (`sensory-array --healthcheck`).

  aegis:
    # Build context is agent-core/ (build.rs reads shared/proto). PKCS#11 signer feature is on by default;
    # the HSM's PKCS#11 module (.so) is NOT in the image: put it in ${AEGIS_HSM_MODULE_DIR}.
    build:
      context: ..
      dockerfile: zone-b/aegis/Dockerfile
      args:
        AEGIS_FEATURES: ${AEGIS_FEATURES:-pkcs11}
    image: afe-aegis:local # also used by aegis-supervisor
    container_name: afe-aegis
    mem_limit: ${AEGIS_MEM_LIMIT:?set AEGIS_MEM_LIMIT (see .env.example)}
    cpus: ${AEGIS_CPUS:?set AEGIS_CPUS (see .env.example)}
    pids_limit: ${AEGIS_PIDS_LIMIT:?set AEGIS_PIDS_LIMIT (see .env.example)}
    environment:
      AEGIS_ENV: production
      AEGIS_LISTEN_ADDR: 0.0.0.0:50051
      AEGIS_STATE_DIR: /var/lib/aegis
      # Production refuses to boot on an empty state dir. Set to 1 for the FIRST start only, then unset.
      AEGIS_ALLOW_FRESH_STATE: ${AEGIS_ALLOW_FRESH_STATE:-}
      # Owner-supplied files (no invented risk limits): limits.json, identities.json, hsm_pin in AEGIS_CONFIG_DIR.
      AEGIS_LIMITS_FILE: /cfg/limits.json
      AEGIS_IDENTITIES_FILE: /cfg/identities.json
      AEGIS_TLS_CERT: /tls/server.pem
      AEGIS_TLS_KEY: /tls/server.key
      AEGIS_TLS_CLIENT_CA: /tls/ca.pem
      AEGIS_SIGNER: pkcs11
      AEGIS_PKCS11_MODULE: ${AEGIS_PKCS11_MODULE:-}
      AEGIS_PKCS11_TOKEN_LABEL: ${AEGIS_PKCS11_TOKEN_LABEL:-}
      AEGIS_PKCS11_KEY_LABEL: ${AEGIS_PKCS11_KEY_LABEL:-}
      AEGIS_PKCS11_PIN_FILE: /cfg/hsm_pin
    volumes:
      - aegis-state:/var/lib/aegis
      - ${AEGIS_CONFIG_DIR:-./secrets/aegis-config}:/cfg:ro
      - ${AEGIS_TLS_DIR:-./secrets/aegis-tls}:/tls:ro
      - ${AEGIS_HSM_MODULE_DIR:-./secrets/hsm}:/hsm:ro
    networks:
      - zone-ab-grpc
      - zone-bc-audit
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # HEALTHCHECK is defined in the image (TCP connect to the listen port; it does not do the mTLS handshake).

  # Independent liveness Supervisor (`aegis supervisor`): same image, separate process and identity. It probes
  # Aegis over mTLS and latches the HARD kill switch when Aegis stops answering (see zone-b/aegis/README.md).
  # Its client certificate CN needs the roles state-reader + kill-trigger in the identities file.
  aegis-supervisor:
    image: afe-aegis:local
    command: ["supervisor"]
    container_name: afe-aegis-supervisor
    mem_limit: ${AEGIS_SUPERVISOR_MEM_LIMIT:?set AEGIS_SUPERVISOR_MEM_LIMIT (see .env.example)}
    cpus: ${AEGIS_SUPERVISOR_CPUS:?set AEGIS_SUPERVISOR_CPUS (see .env.example)}
    pids_limit: ${AEGIS_SUPERVISOR_PIDS_LIMIT:?set AEGIS_SUPERVISOR_PIDS_LIMIT (see .env.example)}
    environment:
      AEGIS_ENV: production
      AEGIS_SUPERVISOR_TARGET: https://aegis:50051
      AEGIS_SUPERVISOR_TLS_CA: /tls/ca.pem
      AEGIS_SUPERVISOR_TLS_CERT: /tls/client.pem
      AEGIS_SUPERVISOR_TLS_KEY: /tls/client.key
      AEGIS_SUPERVISOR_TRIP_AFTER_MS: ${AEGIS_SUPERVISOR_TRIP_AFTER_MS:-60000} # allowed 10000-60000
      AEGIS_SUPERVISOR_PROBE_INTERVAL_MS: ${AEGIS_SUPERVISOR_PROBE_INTERVAL_MS:-1000}
      AEGIS_SUPERVISOR_PROBE_TIMEOUT_MS: ${AEGIS_SUPERVISOR_PROBE_TIMEOUT_MS:-2000}
      # ALI-163: written after every probe step; the healthcheck below fails when it goes stale, so a hung
      # Supervisor turns unhealthy instead of silently disabling the liveness backstop. Alert on unhealthy.
      AEGIS_SUPERVISOR_HEARTBEAT_FILE: /run/aegis-supervisor/heartbeat
      AEGIS_SUPERVISOR_HEARTBEAT_MAX_AGE_MS: ${AEGIS_SUPERVISOR_HEARTBEAT_MAX_AGE_MS:-10000}
    volumes:
      - ${AEGIS_SUPERVISOR_TLS_DIR:-./secrets/supervisor-tls}:/tls:ro
    tmpfs:
      - /run/aegis-supervisor:uid=65532,gid=65532,mode=0700
    depends_on:
      - aegis # started, not healthy: the Supervisor must keep running (and trip) while Aegis is down
    healthcheck:
      # Replaces the image's TCP check (which targets the Aegis listen port and does not apply here).
      test: ["CMD", "/usr/local/bin/aegis", "supervisor-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - zone-ab-grpc
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # execution-motor: gRPC service (agent-core/zone-b/execution-motor). Requires MOTOR_TLS_* (mTLS server
  # material) and AEGIS_CLIENT_TLS_* (mTLS to report fills back to Aegis) via mounted secrets; refuses to
  # start without them in production. MOTOR_ATTESTATION_KEYS_FILE and Alpaca credentials are owner-supplied.
  execution-motor:
    build:
      context: ..
      dockerfile: zone-b/execution-motor/Dockerfile
    container_name: afe-execution-motor
    mem_limit: ${EXECUTION_MOTOR_MEM_LIMIT:?set EXECUTION_MOTOR_MEM_LIMIT (see .env.example)}
    cpus: ${EXECUTION_MOTOR_CPUS:?set EXECUTION_MOTOR_CPUS (see .env.example)}
    pids_limit: ${EXECUTION_MOTOR_PIDS_LIMIT:?set EXECUTION_MOTOR_PIDS_LIMIT (see .env.example)}
    environment:
      PYTHONUNBUFFERED: "1"
      MOTOR_ENV: production
      MOTOR_LISTEN_ADDR: 0.0.0.0:50052
      AEGIS_TARGET: aegis:50051
      MOTOR_STATE_DIR: /var/lib/execution-motor
      MOTOR_TLS_CERT: /tls/server.pem
      MOTOR_TLS_KEY: /tls/server.key
      MOTOR_TLS_CLIENT_CA: /tls/ca.pem
      AEGIS_CLIENT_TLS_CA: /aegis-tls/ca.pem
      AEGIS_CLIENT_TLS_CERT: /aegis-tls/client.pem
      AEGIS_CLIENT_TLS_KEY: /aegis-tls/client.key
      MOTOR_ATTESTATION_KEYS_FILE: /cfg/attestation-keys.json
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      # No defaults for the caps: an empty cap is a startup error in the motor (fail closed). TODO(owner): choose values.
      MOTOR_MAX_ORDER_NOTIONAL_USD: ${MOTOR_MAX_ORDER_NOTIONAL_USD:?set MOTOR_MAX_ORDER_NOTIONAL_USD}
      MOTOR_MAX_SESSION_NOTIONAL_USD: ${MOTOR_MAX_SESSION_NOTIONAL_USD:?set MOTOR_MAX_SESSION_NOTIONAL_USD}
      # Compliance gates (ALI-161): one write-once manifest per released order, and the SHARP promotion
      # gate. Both use the audit DB as the least-privilege app role (INSERT+SELECT only).
      MOTOR_MANIFEST_DIR: /var/lib/afe-manifests
      MOTOR_SHARP_STRATEGY_MAP: /cfg/sharp-strategies.json # owner-supplied {"<strategy_id>": "<proposal_id>"}
      POSTGRES_HOST: postgres-audit
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${AUDIT_DB_NAME:-trading_audit}
      POSTGRES_USER: afe_audit_app
      POSTGRES_PASSWORD: ${AFE_AUDIT_APP_PASSWORD:?set AFE_AUDIT_APP_PASSWORD (>= 16 chars, differs from owner)}
    volumes:
      - execution-motor-state:/var/lib/execution-motor
      - execution-motor-manifests:/var/lib/afe-manifests # TODO(owner): WORM/object-lock storage in production
      - ${MOTOR_TLS_DIR:-./secrets/motor-tls}:/tls:ro
      - ${MOTOR_AEGIS_TLS_DIR:-./secrets/motor-aegis-tls}:/aegis-tls:ro
      - ${MOTOR_CONFIG_DIR:-./secrets/motor-config}:/cfg:ro
    depends_on:
      aegis:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
    networks:
      - zone-ab-grpc
      - zone-bc-audit
      - zone-b-egress # broker API
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # refdata-bridge: pushes sensory-array snapshots + regime-detector labels into Aegis.PushReferenceData
  # (agent-core/zone-b/refdata-bridge). Role market-data-writer in Aegis's identities file.
  refdata-bridge:
    build:
      context: ..
      dockerfile: zone-b/refdata-bridge/Dockerfile
    container_name: afe-refdata-bridge
    mem_limit: ${REFDATA_BRIDGE_MEM_LIMIT:?set REFDATA_BRIDGE_MEM_LIMIT (see .env.example)}
    cpus: ${REFDATA_BRIDGE_CPUS:?set REFDATA_BRIDGE_CPUS (see .env.example)}
    pids_limit: ${REFDATA_BRIDGE_PIDS_LIMIT:?set REFDATA_BRIDGE_PIDS_LIMIT (see .env.example)}
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: production
      REDIS_URL: redis://refdata-bridge:${REDIS_REFDATA_PASSWORD:?}@redis:6379
      AEGIS_TARGET: aegis:50051
      # The bridge reads REFDATA_CLIENT_TLS_* (see zone-b/refdata-bridge/README.md). These were
      # AEGIS_CLIENT_TLS_*, which it ignores, so it silently ran a plaintext channel (ALI-167).
      REFDATA_CLIENT_TLS_CA: /aegis-tls/ca.pem
      REFDATA_CLIENT_TLS_CERT: /aegis-tls/client.pem
      REFDATA_CLIENT_TLS_KEY: /aegis-tls/client.key
    volumes:
      - ${REFDATA_AEGIS_TLS_DIR:-./secrets/refdata-aegis-tls}:/aegis-tls:ro
    depends_on:
      aegis:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - zone-a-internal
      - zone-ab-grpc
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # -------------------------------------------------------------
  # SHARED DATA PLANE
  # -------------------------------------------------------------
  questdb:
    image: questdb/questdb:8.0.3@sha256:1178c2d0fdbeece163078b56b88c185c269b7c3ad04c3dce6513dad868a3c127
    container_name: afe-questdb
    mem_limit: ${QUESTDB_MEM_LIMIT:?set QUESTDB_MEM_LIMIT (see .env.example)}
    cpus: ${QUESTDB_CPUS:?set QUESTDB_CPUS (see .env.example)}
    pids_limit: ${QUESTDB_PIDS_LIMIT:?set QUESTDB_PIDS_LIMIT (see .env.example)}
    # questdb (uid 10001): with a fixed non-root user the entrypoint skips its chown + gosu step, so no
    # capability is needed. The image's own data dir and the volume are owned by that uid.
    user: "10001:10001"
    environment:
      QDB_CAIRO_WRITER_DATA_APPEND_PAGE_SIZE: "4194304"
      QDB_TELEMETRY_ENABLED: "false"
      # ALI-20 auth (all verified on 8.0.3, 2026-09-29): HTTP REST/console basic auth (401 without it),
      # PG wire credentials (the default admin/quest is refused), ILP/TCP ECDSA keys from auth.conf.
      QDB_HTTP_USER: ${QUESTDB_HTTP_USER:?set QUESTDB_HTTP_USER}
      QDB_HTTP_PASSWORD: ${QUESTDB_HTTP_PASSWORD:?set QUESTDB_HTTP_PASSWORD (>= 16 chars)}
      QDB_PG_USER: ${QUESTDB_PG_USER:?set QUESTDB_PG_USER}
      QDB_PG_PASSWORD: ${QUESTDB_PG_PASSWORD:?set QUESTDB_PG_PASSWORD (>= 16 chars)}
      # Resolved against the data root (/var/lib/questdb). A missing file stops QuestDB (fail closed).
      QDB_LINE_TCP_AUTH_DB_PATH: ilp-auth/auth.conf
      # Only /status on the min health server (9003) skips auth; it reveals liveness, nothing else.
      QDB_HTTP_HEALTH_CHECK_AUTHENTICATION_REQUIRED: "false"
    volumes:
      - questdb-data:/var/lib/questdb # image WORKDIR / data root (not /root/.questdb)
      # auth.conf: `<kid> ec-p-256-sha256 <x> <y>` (public keys only). dev-tls/generate-dev-certs.sh
      # shows the format; production keys are owner-supplied.
      - ${QUESTDB_ILP_AUTH_DIR:-./secrets/questdb-ilp-auth}:/var/lib/questdb/ilp-auth:ro
    tmpfs:
      - /tmp:exec,uid=10001,gid=10001,mode=0700 # JNI library is unpacked here, so it must allow exec
    read_only: true # verified 2026-09-29 with cap_drop ALL and the tmpfs above
    networks:
      - zone-a-internal
      - zone-ab-grpc
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      # No curl/wget in the image. The min health server (9003) answers "Status: Healthy" with 200.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/9003 && printf 'GET /status HTTP/1.0\r\n\r\n' >&3 && read -r line <&3 && [[ $$line == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ALI-20: no anonymous access; one ACL user per service, each limited to the exact pub/sub command
  # and channel it needs (Redis 7 selectors), so e.g. only regime-detector can publish regime:labels
  # and nothing can read or write keys. noeviction: nothing here may be silently dropped (Aegis keeps
  # its risk state in its own state dir, not in Redis). Passwords are owner-supplied, URL-safe (hex).
  redis:
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    container_name: afe-redis
    mem_limit: ${REDIS_MEM_LIMIT:?set REDIS_MEM_LIMIT (see .env.example)}
    cpus: ${REDIS_CPUS:?set REDIS_CPUS (see .env.example)}
    pids_limit: ${REDIS_PIDS_LIMIT:?set REDIS_PIDS_LIMIT (see .env.example)}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --user
      - default
      - "off"
      - --user
      - sensory-array
      - "on"
      - ">${REDIS_SENSORY_PASSWORD:?set REDIS_SENSORY_PASSWORD (hex)}"
      - resetchannels
      - "(+publish &sensory:snapshots)"
      - "(+subscribe &regime:labels)"
      - "+@connection"
      - --user
      - regime-detector
      - "on"
      - ">${REDIS_REGIME_PASSWORD:?set REDIS_REGIME_PASSWORD (hex)}"
      - resetchannels
      - "(+publish &regime:labels)"
      - "+@connection"
      - --user
      - cognitive-core
      - "on"
      - ">${REDIS_COGNITIVE_PASSWORD:?set REDIS_COGNITIVE_PASSWORD (hex)}"
      - resetchannels
      - "(+subscribe &sensory:snapshots)"
      - "+@connection"
      - --user
      - refdata-bridge
      - "on"
      - ">${REDIS_REFDATA_PASSWORD:?set REDIS_REFDATA_PASSWORD (hex)}"
      - resetchannels
      - "(+subscribe &sensory:snapshots &regime:labels)"
      - "+@connection"
      - --user
      - healthcheck
      - "on"
      - ">${REDIS_HEALTHCHECK_PASSWORD:?set REDIS_HEALTHCHECK_PASSWORD (hex)}"
      - "+ping"
      - "+time"
    environment:
      REDISCLI_AUTH: ${REDIS_HEALTHCHECK_PASSWORD:?set REDIS_HEALTHCHECK_PASSWORD (hex)}
    # redis (uid 999, gid 1000): a fixed non-root user makes the entrypoint skip chown + su-exec.
    # Verified 2026-09-29: starts, writes the AOF and answers the ACL healthcheck with read_only +
    # cap_drop ALL. REDIS_MEM_LIMIT must stay above --maxmemory (512mb) plus Redis overhead.
    user: "999:1000"
    read_only: true
    volumes:
      - redis-data:/data
    networks:
      - zone-ab-grpc
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "healthcheck", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # ZONE C - COMPLIANCE
  # -------------------------------------------------------------
  # audit-logger, compliance-manifest and sharp-gate are Python LIBRARIES (afe_audit, afe_manifest,
  # afe_sharp) imported by the services that need them; they are not daemons and have no Dockerfile,
  # so they are intentionally not compose services. Their database is postgres-audit below.
  postgres-audit:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    container_name: afe-postgres-audit
    mem_limit: ${POSTGRES_AUDIT_MEM_LIMIT:?set POSTGRES_AUDIT_MEM_LIMIT (see .env.example)}
    cpus: ${POSTGRES_AUDIT_CPUS:?set POSTGRES_AUDIT_CPUS (see .env.example)}
    pids_limit: ${POSTGRES_AUDIT_PIDS_LIMIT:?set POSTGRES_AUDIT_PIDS_LIMIT (see .env.example)}
    environment:
      # Bootstrap superuser: used by the init script only. Services connect as afe_audit_app.
      POSTGRES_DB: ${AUDIT_DB_NAME:-trading_audit}
      POSTGRES_USER: ${AUDIT_DB_USER:-audit_admin}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?set AUDIT_DB_PASSWORD}
      # Passwords for the two least-privilege roles created by sql/init-audit-db.sh (>= 16 chars, different).
      AFE_AUDIT_OWNER_PASSWORD: ${AFE_AUDIT_OWNER_PASSWORD:?set AFE_AUDIT_OWNER_PASSWORD (>= 16 chars)}
      AFE_AUDIT_APP_PASSWORD: ${AFE_AUDIT_APP_PASSWORD:?set AFE_AUDIT_APP_PASSWORD (>= 16 chars, differs from owner)}
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=3
      -c max_replication_slots=3
    # postgres (uid 70 on alpine): a fixed non-root user makes the entrypoint skip chown + su-exec.
    # Verified 2026-09-29: first init (incl. init-audit-db.sh roles) works with read_only + cap_drop
    # ALL, and afe_audit_app can log in.
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775 # unix socket + lock file
      - /tmp:uid=70,gid=70,mode=1777
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data
      # The image runs the top-level *.sh on first initialisation only (files must have LF endings).
      - ../zone-c/audit-logger/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - zone-bc-audit
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # hitl-backend (agent-core/zone-c/hitl-backend, ALI-156): REST contract behind the operator terminal;
  # fronts Aegis holds (ListHolds/GetHold/ResolveHold as CN hitl-backend, role hold-resolver), relays
  # released decisions to execution-motor, audits every attempt as afe_audit_app. Behind a profile:
  # TODO(owner): TLS between the terminal and this service (the terminal refuses plain http to a
  # non-loopback host in production), and a distress classifier before approvals work in production.
  hitl-backend:
    profiles: ["hitl-backend"]
    build:
      context: ..
      dockerfile: zone-c/hitl-backend/Dockerfile
    container_name: afe-hitl-backend
    mem_limit: ${HITL_BACKEND_MEM_LIMIT:?set HITL_BACKEND_MEM_LIMIT (see .env.example)}
    cpus: ${HITL_BACKEND_CPUS:?set HITL_BACKEND_CPUS (see .env.example)}
    pids_limit: ${HITL_BACKEND_PIDS_LIMIT:?set HITL_BACKEND_PIDS_LIMIT (see .env.example)}
    environment:
      HITL_ENV: production
      HITL_BACKEND_LISTEN: 0.0.0.0:8090
      HITL_JWT_SECRET: ${HITL_JWT_SECRET:?set HITL_JWT_SECRET (>= 32 chars, same as the terminal)}
      HITL_JWT_ISSUER: ${HITL_JWT_ISSUER:?set HITL_JWT_ISSUER}
      HITL_JWT_AUDIENCE: ${HITL_JWT_AUDIENCE:?set HITL_JWT_AUDIENCE}
      HITL_API_TOKEN: ${HITL_API_TOKEN:-}
      AEGIS_TARGET: aegis:50051
      HITL_AEGIS_IDENTITY: hitl-backend
      HITL_AEGIS_TLS_CA: /aegis-tls/ca.pem
      HITL_AEGIS_TLS_CERT: /aegis-tls/client.pem
      HITL_AEGIS_TLS_KEY: /aegis-tls/client.key
      MOTOR_TARGET: execution-motor:50052
      HITL_MOTOR_TLS_CA: /aegis-tls/ca.pem
      HITL_MOTOR_TLS_CERT: /aegis-tls/client.pem
      HITL_MOTOR_TLS_KEY: /aegis-tls/client.key
      HITL_FOUR_EYES_QUANTITY_THRESHOLD: ${HITL_FOUR_EYES_QUANTITY_THRESHOLD:?set HITL_FOUR_EYES_QUANTITY_THRESHOLD (shares)}
      POSTGRES_HOST: postgres-audit
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${AUDIT_DB_NAME:-trading_audit}
      POSTGRES_USER: afe_audit_app
      POSTGRES_PASSWORD: ${AFE_AUDIT_APP_PASSWORD:?set AFE_AUDIT_APP_PASSWORD}
    volumes:
      - ${HITL_BACKEND_TLS_DIR:-./secrets/hitl-backend-tls}:/aegis-tls:ro
    depends_on:
      aegis:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
    networks:
      - zone-ab-grpc
      - zone-bc-audit
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  hitl-interface:
    build:
      context: ../zone-c/hitl-interface
      dockerfile: Dockerfile
    container_name: afe-hitl-interface
    mem_limit: ${HITL_INTERFACE_MEM_LIMIT:?set HITL_INTERFACE_MEM_LIMIT (see .env.example)}
    cpus: ${HITL_INTERFACE_CPUS:?set HITL_INTERFACE_CPUS (see .env.example)}
    pids_limit: ${HITL_INTERFACE_PIDS_LIMIT:?set HITL_INTERFACE_PIDS_LIMIT (see .env.example)}
    environment:
      # Server-side variables only; there are no NEXT_PUBLIC_* variables. The app exits at startup if the
      # secret is unset, < 32 chars or a placeholder.
      HITL_JWT_SECRET: ${HITL_JWT_SECRET:?set HITL_JWT_SECRET (>= 32 chars, e.g. openssl rand -base64 48)}
      # No HITL backend exists in this repo yet (docs/api-contract.md is PROPOSED). Until one does, every
      # decision fails closed as "not approved".
      HITL_API_BASE_URL: ${HITL_API_BASE_URL:?set HITL_API_BASE_URL to the https:// URL of the HITL backend}
      HITL_JWT_ISSUER: ${HITL_JWT_ISSUER:?set HITL_JWT_ISSUER (required in production)}
      HITL_JWT_AUDIENCE: ${HITL_JWT_AUDIENCE:?set HITL_JWT_AUDIENCE (required in production)}
      HITL_API_TOKEN: ${HITL_API_TOKEN:-}
      HITL_ALLOWED_ORIGINS: ${HITL_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${HITL_HOST_PORT:-3000}:3000" # operator terminal; put a TLS-terminating proxy in front
    networks:
      - zone-bc-audit
      - zone-c-external
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # HEALTHCHECK is defined in the image (GET /api/health).

volumes:
  chroma-data:
  questdb-data:
  redis-data:
  regime-models:
  aegis-state:
  execution-motor-state:
  execution-motor-manifests:
  postgres-audit-data:
