# LOCAL DEVELOPMENT OVERRIDE. Never use this file outside a developer machine.
#
#   cd agent-core/infrastructure/dev-tls && ./generate-dev-certs.sh --yes-i-know-this-is-dev-only
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What it changes (and why it is unsafe for anything else):
#   * publishes host ports (loopback only) for QuestDB, Redis, Chroma and Aegis,
#   * attaches those services to a non-internal `dev-host` network (Docker cannot publish ports of
#     containers that are only on `internal: true` networks) which weakens zone isolation,
#   * runs Aegis with AEGIS_ENV=development and the software dev signer instead of the HSM,
#   * wires real (but throwaway) mTLS between cognitive-core / aegis-supervisor and Aegis using the
#     dev-only certificates generated by dev-tls/generate-dev-certs.sh into dev-tls/out/. See
#     dev-tls/README.md. This replaces the previous AEGIS_INSECURE_DEV=1 plaintext mode: Aegis refuses
#     insecure mode unless it binds to loopback, and loopback inside a container is unreachable from
#     other containers or the host, so plaintext could never actually run Aegis in this override.
#
# Run dev-tls/generate-dev-certs.sh BEFORE `docker compose up`, or the /tls mounts below point at a
# missing directory and the affected containers fail to start.
#
# Aegis still needs an owner-supplied limits.json in ${AEGIS_CONFIG_DIR} (default ./secrets/aegis-config);
# no risk limits are invented here. The DEV-ONLY identities file (dev-tls/identities.json) and the pinned
# dev attestation signing key (dev-tls/out/aegis-signer, matching dev-tls/out/execution-motor/
# attestation-keys.json) are mounted directly below (ALI-167): without a pinned seed Aegis's dev signer
# picks a random key at every start and execution-motor could never verify an approval.

networks:
  dev-host: {}

services:
  questdb:
    ports:
      - "127.0.0.1:9000:9000" # REST / web console
      - "127.0.0.1:9009:9009" # ILP
    networks:
      - dev-host

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - dev-host

  vector-db:
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - dev-host

  aegis:
    build:
      args:
        AEGIS_FEATURES: ""
    environment:
      AEGIS_ENV: development
      AEGIS_SIGNER: dev
      AEGIS_DEV_SIGNING_SEED_FILE: /signer/seed.hex
      AEGIS_IDENTITIES_FILE: /dev-identities.json
    # Replaces the base file's ${AEGIS_TLS_DIR:-./secrets/aegis-tls} mount with the dev-tls generated
    # server identity (CN=aegis, SAN=DNS:aegis) so real mTLS works out of the box in dev.
    volumes: !override
      - aegis-state:/var/lib/aegis
      - ${AEGIS_CONFIG_DIR:-./secrets/aegis-config}:/cfg:ro
      - ./dev-tls/out/aegis:/tls:ro
      - ./dev-tls/out/aegis-signer:/signer:ro
      - ./dev-tls/out/identities.json:/dev-identities.json:ro # generated: adds the operator + reset approvers (ALI-170)
      - ${AEGIS_HSM_MODULE_DIR:-./secrets/hsm}:/hsm:ro
    ports:
      - "127.0.0.1:50051:50051" # gRPC, mTLS (client certs required — see dev-tls/README.md)
    networks:
      - dev-host

  aegis-supervisor:
    environment:
      AEGIS_ENV: development
    # Replaces the base file's ${AEGIS_SUPERVISOR_TLS_DIR:-./secrets/supervisor-tls} mount with the
    # dev-tls generated aegis-supervisor client identity (roles state-reader + kill-trigger).
    volumes: !override
      - ./dev-tls/out/aegis-supervisor:/tls:ro

  # cognitive-core's gRPC channel to Aegis now uses AEGIS_CLIENT_TLS_CA/CERT/KEY (see
  # zone-a/cognitive-core/sinks.py) instead of plaintext. CN=cognitive-core, role signal-submitter.
  # It also relays approved decisions to execution-motor (MOTOR_CLIENT_TLS_*, see sinks.py); the same
  # dev-tls client cert is presented to both servers since both trust the one dev CA.
  cognitive-core:
    environment:
      AEGIS_CLIENT_TLS_CA: /tls/ca.pem
      AEGIS_CLIENT_TLS_CERT: /tls/client.pem
      AEGIS_CLIENT_TLS_KEY: /tls/client.key
      MOTOR_TARGET: execution-motor:50052
      MOTOR_CLIENT_TLS_CA: /tls/ca.pem
      MOTOR_CLIENT_TLS_CERT: /tls/client.pem
      MOTOR_CLIENT_TLS_KEY: /tls/client.key
    volumes:
      - ./dev-tls/out/cognitive-core:/tls:ro
    networks:
      - dev-host

  # execution-motor (agent-core/zone-b/execution-motor): own mTLS listener (server cert, dev-tls issues
  # CN=execution-motor) plus a client identity to report fills back to Aegis (AEGIS_CLIENT_TLS_*, the
  # execution-motor client cert generated for that purpose, role execution-reporter).
  execution-motor:
    environment:
      MOTOR_ENV: development
      AEGIS_CLIENT_TLS_CA: /aegis-tls/ca.pem
      AEGIS_CLIENT_TLS_CERT: /aegis-tls/client.pem
      AEGIS_CLIENT_TLS_KEY: /aegis-tls/client.key
      MOTOR_USE_MOCK_BROKER: "1" # no real Alpaca credentials in dev
      MOTOR_ATTESTATION_KEYS_FILE: /tls/attestation-keys.json # dev signer's public key (dev-tls, ALI-167)
    volumes: !override
      - execution-motor-state:/var/lib/execution-motor
      - ./dev-tls/out/execution-motor:/tls:ro
      - ./dev-tls/out/execution-motor:/aegis-tls:ro
      - ${MOTOR_CONFIG_DIR:-./secrets/motor-config}:/cfg:ro
    ports:
      - "127.0.0.1:50052:50052"
    networks:
      - dev-host

  # refdata-bridge (agent-core/zone-b/refdata-bridge): pushes sensory-array + regime-detector data into
  # Aegis.PushReferenceData. CN=refdata-bridge, role market-data-writer.
  refdata-bridge:
    environment:
      ENVIRONMENT: development
      REFDATA_CLIENT_TLS_CA: /aegis-tls/ca.pem
      REFDATA_CLIENT_TLS_CERT: /aegis-tls/client.pem
      REFDATA_CLIENT_TLS_KEY: /aegis-tls/client.key
    volumes: !override
      - ./dev-tls/out/refdata-bridge:/aegis-tls:ro
    networks:
      - dev-host
