# LOCAL DEVELOPMENT OVERRIDE. Never use this file outside a developer machine.
#
#   cd agent-core/infrastructure/dev-tls && ./generate-dev-certs.sh --yes-i-know-this-is-dev-only
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What it changes (and why it is unsafe for anything else):
#   * publishes host ports (loopback only) for QuestDB, Redis, Chroma (via its token proxy), Aegis and
#     execution-motor (the HITL terminal is reached only through hitl-proxy's HTTPS port, as in the base
#     file); data-store auth (QuestDB, Redis ACL, Chroma token) stays on,
#   * attaches those services to a non-internal `dev-host` network (Docker cannot publish ports of
#     containers that are only on `internal: true` networks) which weakens zone isolation,
#   * runs Aegis with AEGIS_ENV=development and the software dev signer instead of the HSM,
#   * wires real (but throwaway) mTLS between cognitive-core / aegis-supervisor and Aegis using the
#     dev-only certificates generated by dev-tls/generate-dev-certs.sh into dev-tls/out/. See
#     dev-tls/README.md. This replaces the previous AEGIS_INSECURE_DEV=1 plaintext mode: Aegis refuses
#     insecure mode unless it binds to loopback, and loopback inside a container is unreachable from
#     other containers or the host, so plaintext could never actually run Aegis in this override.
#
# Run dev-tls/generate-dev-certs.sh BEFORE `docker compose up`, or the /tls mounts below point at a
# missing directory and the affected containers fail to start.
#
# Aegis still needs an owner-supplied limits.json in ${AEGIS_CONFIG_DIR} (default ./secrets/aegis-config);
# no risk limits are invented here. The DEV-ONLY identities file (dev-tls/identities.json) and the pinned
# dev attestation signing key (dev-tls/out/aegis-signer, matching dev-tls/out/execution-motor/
# attestation-keys.json) are mounted directly below (ALI-167): without a pinned seed Aegis's dev signer
# picks a random key at every start and execution-motor could never verify an approval.

networks:
  dev-host: {}

services:
  # Auth stays ON in dev (ALI-20): the console/REST needs QUESTDB_HTTP_USER/PASSWORD, and ILP writers
  # need the dev key generated by dev-tls/generate-dev-certs.sh (public half mounted here; put the
  # private half, out/questdb-ilp/ilp-token, into .env as QUESTDB_ILP_AUTH_TOKEN).
  questdb:
    volumes: !override
      - questdb-data:/var/lib/questdb
      - ./dev-tls/out/questdb-ilp:/var/lib/questdb/ilp-auth:ro
    ports:
      - "127.0.0.1:9000:9000" # REST / web console (basic auth)
      - "127.0.0.1:9009:9009" # ILP (ECDSA auth)
    networks:
      - dev-host

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - dev-host

  vector-db: # the token proxy: host clients need "Authorization: Bearer $CHROMA_AUTH_TOKEN" too
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - dev-host

  aegis:
    build:
      args:
        AEGIS_FEATURES: ""
    environment:
      AEGIS_ENV: development
      AEGIS_SIGNER: dev
      AEGIS_DEV_SIGNING_SEED_FILE: /signer/seed.hex
      AEGIS_IDENTITIES_FILE: /dev-identities.json
    # Replaces the base file's ${AEGIS_TLS_DIR:-./secrets/aegis-tls} mount with the dev-tls generated
    # server identity (CN=aegis, SAN=DNS:aegis) so real mTLS works out of the box in dev.
    volumes: !override
      - aegis-state:/var/lib/aegis
      - ${AEGIS_CONFIG_DIR:-./secrets/aegis-config}:/cfg:ro
      - ./dev-tls/out/aegis:/tls:ro
      - ./dev-tls/out/aegis-signer:/signer:ro
      - ./dev-tls/out/identities.json:/dev-identities.json:ro # generated: adds the operator + reset approvers (ALI-170)
      - ${AEGIS_HSM_MODULE_DIR:-./secrets/hsm}:/hsm:ro
    ports:
      - "127.0.0.1:50051:50051" # gRPC, mTLS (client certs required — see dev-tls/README.md)
    networks:
      - dev-host

  aegis-supervisor:
    environment:
      AEGIS_ENV: development
    # Replaces the base file's ${AEGIS_SUPERVISOR_TLS_DIR:-./secrets/supervisor-tls} mount with the
    # dev-tls generated aegis-supervisor client identity (roles state-reader + kill-trigger).
    volumes: !override
      - ./dev-tls/out/aegis-supervisor:/tls:ro

  # cognitive-core's gRPC channel to Aegis now uses AEGIS_CLIENT_TLS_CA/CERT/KEY (see
  # zone-a/cognitive-core/sinks.py) instead of plaintext. CN=cognitive-core, role signal-submitter.
  # It also relays approved decisions to execution-motor (MOTOR_CLIENT_TLS_*, see sinks.py); the same
  # dev-tls client cert is presented to both servers since both trust the one dev CA.
  cognitive-core:
    environment:
      AEGIS_CLIENT_TLS_CA: /tls/ca.pem
      AEGIS_CLIENT_TLS_CERT: /tls/client.pem
      AEGIS_CLIENT_TLS_KEY: /tls/client.key
      MOTOR_TARGET: execution-motor:50052
      MOTOR_CLIENT_TLS_CA: /tls/ca.pem
      MOTOR_CLIENT_TLS_CERT: /tls/client.pem
      MOTOR_CLIENT_TLS_KEY: /tls/client.key
    volumes:
      - ./dev-tls/out/cognitive-core:/tls:ro
    networks:
      - dev-host

  # llm-gateway (ADR-003 Option 2): a developer machine has no IAM role, so dev uses static AWS
  # credentials, given ONLY to the gateway (never to cognitive-core). Without valid credentials the
  # gateway's Bedrock calls fail and every debate degrades to abstain. AWS_SESSION_TOKEN is only
  # needed for temporary credentials (SSO/STS).
  llm-gateway:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?dev only - set AWS credentials for the LLM gateway}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?dev only - set AWS credentials for the LLM gateway}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

  # execution-motor (agent-core/zone-b/execution-motor): own mTLS listener (server cert, dev-tls issues
  # CN=execution-motor) plus a client identity to report fills back to Aegis (AEGIS_CLIENT_TLS_*, the
  # execution-motor client cert generated for that purpose, roles state-reader + execution-reporter:
  # the motor subscribes to WatchKillSwitchState to cancel open orders on a LOGIC/HARD trip, ALI-162).
  execution-motor:
    environment:
      MOTOR_ENV: development
      AEGIS_CLIENT_TLS_CA: /aegis-tls/ca.pem
      AEGIS_CLIENT_TLS_CERT: /aegis-tls/client.pem
      AEGIS_CLIENT_TLS_KEY: /aegis-tls/client.key
      # Default: in-memory mock broker. MOTOR_DEV_USE_MOCK_BROKER=0 routes through broker-gateway instead
      # (needs real Alpaca PAPER keys in .env; the motor itself never receives them, ADR-004).
      MOTOR_USE_MOCK_BROKER: ${MOTOR_DEV_USE_MOCK_BROKER:-1}
      MOTOR_ATTESTATION_KEYS_FILE: /tls/attestation-keys.json # dev signer's public key (dev-tls, ALI-167)
      # Dev has no promoted SHARP proposal (and sharp-gate's migrations are not mounted): skip that gate.
      # Manifests stay ON in dev. Both opt-outs are refused when MOTOR_ENV is production (ALI-161).
      MOTOR_SHARP_DISABLED: "1"
      MOTOR_SHARP_STRATEGY_MAP: ""
    volumes: !override
      - execution-motor-state:/var/lib/execution-motor
      - execution-motor-manifests:/var/lib/afe-manifests
      - ./dev-tls/out/execution-motor:/tls:ro
      - ./dev-tls/out/execution-motor:/aegis-tls:ro
      - ./dev-tls/out/execution-motor:/gateway-tls:ro # same CN=execution-motor client cert
      - ${MOTOR_CONFIG_DIR:-./secrets/motor-config}:/cfg:ro
    ports:
      - "127.0.0.1:50052:50052"
    networks:
      - dev-host

  # broker-gateway (ADR-004): dev-tls server identity (CN=broker-gateway, SAN=DNS:broker-gateway) and the
  # dev signer's public key. Development only because that key is an Ed25519 dev key, which the gateway
  # refuses in production. No host port: only execution-motor may reach it.
  broker-gateway:
    environment:
      GATEWAY_ENV: development
      GATEWAY_ATTESTATION_KEYS_FILE: /tls/attestation-keys.json
    volumes: !override
      - ./dev-tls/out/broker-gateway:/tls:ro

  # refdata-bridge (agent-core/zone-b/refdata-bridge): pushes sensory-array + regime-detector data into
  # Aegis.PushReferenceData. CN=refdata-bridge, role market-data-writer.
  refdata-bridge:
    environment:
      ENVIRONMENT: development
      REFDATA_CLIENT_TLS_CA: /aegis-tls/ca.pem
      REFDATA_CLIENT_TLS_CERT: /aegis-tls/client.pem
      REFDATA_CLIENT_TLS_KEY: /aegis-tls/client.key
    volumes: !override
      - ./dev-tls/out/refdata-bridge:/aegis-tls:ro
    networks:
      - dev-host

  # hitl-backend (ALI-156), started with `--profile hitl-backend`. CN hitl-backend has role
  # hold-resolver in dev-tls/identities.json.
  # No host port: the terminal reaches it through hitl-proxy (https://hitl-proxy:9443).
  hitl-backend:
    environment:
      HITL_ENV: development
      # DEV ONLY attestor generated by dev-tls (listed under hold_attestors in the dev identities.json).
      HITL_APPROVAL_ATTESTOR_ID: dev-hitl-oidc
      HITL_APPROVAL_ATTESTOR_KEY_FILE: /aegis-tls/attestor.seed
    volumes: !override
      - ./dev-tls/out/hitl-backend:/aegis-tls:ro

  # hitl-proxy with the dev-tls certificates: https://localhost:8443 (server.pem, SAN localhost /
  # 127.0.0.1 / ::1) and https://hitl-proxy:9443 (internal.pem), both issued by the dev CA
  # (dev-tls/out/hitl-proxy/ca.pem; trust it in the browser or pass it to curl --cacert).
  hitl-proxy:
    volumes: !override
      - type: bind
        source: ./hitl-proxy
        target: /etc/nginx/conf.d
        read_only: true
      - type: bind
        source: ./dev-tls/out/hitl-proxy
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false

  hitl-interface:
    volumes: !override
      - type: bind
        source: ./dev-tls/out/hitl-proxy/ca.pem
        target: /etc/afe/hitl-proxy-ca.pem
        read_only: true
        bind:
          create_host_path: false
