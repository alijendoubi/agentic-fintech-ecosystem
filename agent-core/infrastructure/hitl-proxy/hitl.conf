# hitl-proxy: TLS-terminating reverse proxy for the HITL operator terminal and hitl-backend
# (owner decision 2026-09-29, DECISIONS-2026-09-29.md row 6). Mounted read-only at /etc/nginx/conf.d
# (it replaces the image's default.conf); included inside the image's http {} block.
#
# Two TLS listeners, no plaintext listener:
#   :8443  operator listener, the ONLY HITL port published on the host. Everything goes to the
#          terminal (hitl-interface:3000), including the terminal's own /api/* routes. The browser
#          never calls hitl-backend (the terminal calls it server side), so /v1/* is refused here.
#   :9443  internal listener on the internal zone-c-hitl network, NOT published. The terminal's
#          server reaches hitl-backend through it (HITL_API_BASE_URL=https://hitl-proxy:9443), so the
#          operator's Bearer token and X-Service-Token travel over TLS. Only /v1/* and /healthz.
#
# Certificates (owner-supplied directory, mounted at /etc/nginx/tls):
#   server.pem / server.key      operator listener (the name operators type in the browser)
#   internal.pem / internal.key  internal listener; SAN must include DNS:hitl-proxy
#   ca.pem                       CA that issued internal.pem (the terminal trusts it via NODE_EXTRA_CA_CERTS)
#
# Upstream names are resolved per request through Docker's DNS (resolver + variables), so the proxy
# starts when hitl-backend's compose profile is off; those requests then fail with 502 and the
# terminal treats that as "not approved" (fail closed).

# Keep the terminal's per-request nonce CSP; proxy-generated responses (errors, refusals) get a
# deny-all CSP instead of none.
map $upstream_http_content_security_policy $hitl_csp {
    ""      "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default $upstream_http_content_security_policy;
}

# ---------------------------------------------------------------------------- shared TLS settings
ssl_protocols TLSv1.2 TLSv1.3;
# TLS 1.2: ECDHE + AEAD only (TLS 1.3 suites are always AEAD).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:hitl_tls:10m;
ssl_session_timeout 1h;
ssl_session_tickets off;
# TODO(owner): OCSP stapling once the production certificate chain is known.

server_tokens off;

# ---------------------------------------------------------------------------- operator listener
server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;

    resolver 127.0.0.11 valid=10s ipv6=off; # Docker's embedded DNS
    resolver_timeout 5s;

    # Timeouts and sizes. The largest legitimate request is the /login token paste (a JWT).
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_max_body_size 64k;
    large_client_header_buffers 4 16k;

    # Security headers. The terminal sets the same values; hide its copies so each header appears once,
    # and send them on proxy-generated responses too (always).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy $hitl_csp always;

    # Liveness of the proxy itself (compose healthcheck); does not touch an upstream.
    location = /proxy-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # hitl-backend is not reachable from the browser (the terminal calls it server side).
    location /v1/ {
        return 404;
    }

    location / {
        set $hitl_terminal http://hitl-interface:3000;
        proxy_pass $hitl_terminal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host with port: the terminal's CSRF check compares the browser's Origin with it.
        proxy_set_header Host $http_host;
        # Overwrite (never append) so a client-sent X-Forwarded-For cannot choose its rate-limit
        # bucket; the terminal reads it with HITL_TRUSTED_PROXY_COUNT=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Authorization (OIDC bearer token) and cookies pass through unchanged (nginx default).
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# ---------------------------------------------------------------------------- internal listener
server {
    listen 9443 ssl;
    server_name hitl-proxy;

    ssl_certificate     /etc/nginx/tls/internal.pem;
    ssl_certificate_key /etc/nginx/tls/internal.key;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    client_max_body_size 16k; # hitl-backend refuses bodies above 16 KiB (http_api.MAX_BODY)
    large_client_header_buffers 4 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    location ~ ^/(v1/|healthz$) {
        set $hitl_backend http://hitl-backend:8090;
        proxy_pass $hitl_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Authorization and X-Service-Token pass through unchanged (nginx default).
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        # The terminal gives up after HITL_API_TIMEOUT_MS (default 5 s) and treats that as not approved.
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
