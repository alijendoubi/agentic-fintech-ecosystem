syntax = "proto3";

package afe.shared;

option python_out = "generated";

import "market_snapshot.proto";

// Trade signal produced by the Cognitive Core (Judge Node) after Blue/Red debate.
// Must pass Aegis PTC validation before reaching the Execution Motor.
message TradeSignal {
  string signal_id = 1;                  // UUID
  string symbol = 2;
  int64 created_at_ns = 3;

  SignalSide side = 4;
  double quantity = 5;                   // Target quantity in shares

  // Probabilistic decision matrix outputs
  double omega = 6;                       // Judge confidence score [0, 1]
  double expected_value = 7;             // E[V] from decision matrix
  double p_success = 8;                  // Regime-conditional win rate
  double p_failure = 9;
  double reward_estimate = 10;
  double risk_estimate = 11;

  // Cost model
  double estimated_spread_cost = 12;
  double estimated_market_impact = 13;
  double estimated_venue_fees = 14;
  double estimated_total_cost = 15;

  // Context
  RegimeLabel regime = 16;
  double regime_confidence = 17;
  string debate_summary = 18;            // Compressed 200-token Judge synthesis

  // Execution constraints
  double price_limit = 19;              // 0 = market order
  int64 valid_until_ns = 20;            // Signal expiry timestamp

  SignalStatus status = 21;
}

enum SignalSide {
  SIDE_UNKNOWN = 0;
  BUY = 1;
  SELL = 2;
  SELL_SHORT = 3;
}

enum SignalStatus {
  SIGNAL_PENDING = 0;
  SIGNAL_APPROVED = 1;               // Passed Aegis PTCs
  SIGNAL_REJECTED_HARD_BLOCK = 2;   // Failed a hard PTC
  SIGNAL_SOFT_BLOCK_PENDING = 3;    // Awaiting HITL confirmation (soft block)
  SIGNAL_ABSTAIN = 4;               // omega < threshold, no trade
  SIGNAL_EXPIRED = 5;
}
